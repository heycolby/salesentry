{% extends "base.html" %}

{% block title %}Confirm Sign In • Sales Course Hub{% endblock %}

{% block content %}
<main class="container-narrow" style="padding-top: 4rem;">
  <div class="glass-card" style="max-width: 440px; margin: 0 auto; text-align: center;">
    <div style="font-size: 2.5rem; margin-bottom: 1rem;">🔓</div>
    <h1 style="font-family: var(--font-heading); font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem;">
      Confirm Your Sign In
    </h1>
    <p style="color: var(--text-muted); font-size: 0.88rem; margin-bottom: 1.5rem;">
      Signing in as <strong>{{ email }}</strong>. Click the button below to complete authentication.
    </p>

    <form action="{{ url_for('verify_token_page') }}" method="POST">
      <input type="hidden" name="t" value="{{ token }}">
      <button type="submit" class="btn-primary">
        <span>Confirm & Enter Training</span>
        <span>→</span>
      </button>
    </form>
  </div>
</main>
{% endblock %}
